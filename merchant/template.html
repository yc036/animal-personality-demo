<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店主离线密码工具</title><style>body{font:16px/1.8 system-ui,sans-serif;background:#f8f6ef;color:#293e34;max-width:850px;margin:40px auto;padding:24px}input,button,textarea{font:inherit;padding:10px;border:1px solid #bbc7b5;border-radius:8px}button{background:#3e624c;color:white;cursor:pointer}label{display:block;margin:18px 0}textarea{box-sizing:border-box;width:100%;height:240px}input[type=url]{width:85%}.notice{padding:15px;background:#e6ecdf;border-radius:12px}#status{white-space:pre-wrap}</style><h1>店主离线密码工具</h1><p>此文件由店主本地打开使用。生成过程不连接服务器，无需注册账户。</p><p class="notice">网站仅在顾客当前浏览器记录3次，清除数据或换设备可重置。此工具不能统计顾客次数或提供可靠防盗用。</p><label>第一步：导入网站当前的 access-codes.json（首次生成可跳过）<br><input id="registry" type="file" accept=".json"></label><label>第二步：本批密码数量 <input id="count" type="number" min="1" max="10000" value="100"></label><label>测评网站地址（可选，用于生成自动填码链接）<br><input id="site" type="url" placeholder="https://你的域名/"></label><button id="generate">生成本批密码</button><p id="status" role="status"></p><label>本批密码，每行一个（请复制到自动发货卡密库）<textarea id="codes" readonly></textarea></label><button id="csv" disabled>下载本批密码 CSV</button> <button id="json" disabled>下载更新后的 access-codes.json</button><p>第三步：把更新后的 access-codes.json 上传到网站根目录，覆盖旧文件后，本批密码才会生效。若网站有 CDN 缓存，请同步刷新此文件的缓存。保留旧密码时务必先导入原文件。</p><p>密码 CSV 只保存在你的电脑，不要上传到公开网站。专属填码链接等同密码，请顾客分享时使用结果页的“复制结果链接”。</p><script>/* SCRIPT */</script></html>
