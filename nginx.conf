# Put the contents of website/ in /var/www/animal-mirror and change server_name.
server {
    listen 8080;
    server_name _;
    root /var/www/animal-mirror;
    index index.html;
    charset utf-8;
    include /etc/nginx/mime.types;
    location = /access-codes.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~* \.(js|css|svg|png|json)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
